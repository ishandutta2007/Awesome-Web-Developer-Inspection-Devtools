<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19;border-radius:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .pulse-pill {
        animation: floatPill 6s ease-in-out infinite alternate;
      }
      .pulse-pill-2 {
        animation: floatPillRev 7s ease-in-out infinite alternate;
      }
      .pulse-pill-3 {
        animation: floatPillSlow 9s ease-in-out infinite alternate;
      }
      .wave-line {
        stroke-dasharray: 8 8;
        animation: dashMove 30s linear infinite;
      }
      .glow-node {
        animation: pulseGlow 3s ease-in-out infinite alternate;
      }

      @keyframes floatPill {
        0% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(-8px) translateX(6px); }
        100% { transform: translateY(4px) translateX(-4px); }
      }
      @keyframes floatPillRev {
        0% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(7px) translateX(-5px); }
        100% { transform: translateY(-6px) translateX(5px); }
      }
      @keyframes floatPillSlow {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-12px); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -1000; }
      }
      @keyframes pulseGlow {
        0% { opacity: 0.35; filter: drop-shadow(0 0 2px #38bdf8); }
        100% { opacity: 0.85; filter: drop-shadow(0 0 10px #818cf8); }
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="360" rx="12" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Subtle Blueprint Tech Grid in Background -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="0.75">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>

    <line x1="150" y1="0" x2="150" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="450" y1="0" x2="450" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="750" y1="0" x2="750" y2="360"/>
    <line x1="900" y1="0" x2="900" y2="360"/>
    <line x1="1050" y1="0" x2="1050" y2="360"/>
  </g>

  <!-- Dynamic / Animated Flow Waves in lower background -->
  <path class="wave-line" d="M -50 290 Q 250 230 550 280 T 1150 270 T 1300 290" fill="none" stroke="#38bdf8" stroke-width="1.8" opacity="0.4"/>
  <path class="wave-line" d="M -50 320 Q 300 370 650 310 T 1250 330" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.3"/>

  <!-- Animated Floating DevTools Inspection Badges/Pills in Background (Positions kept away from central title) -->
  <g class="pulse-pill" opacity="0.75">
    <g transform="translate(60, 42)">
      <rect width="130" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <circle cx="16" cy="15" r="4.5" fill="#38bdf8" class="glow-node"/>
      <text x="30" y="19" fill="#94a3b8" font-size="11" font-weight="600">DOM Inspector</text>
    </g>
  </g>

  <g class="pulse-pill-2" opacity="0.75">
    <g transform="translate(980, 50)">
      <rect width="145" height="30" rx="15" fill="#1e293b" stroke="#a855f7" stroke-width="1"/>
      <circle cx="16" cy="15" r="4.5" fill="#a855f7" class="glow-node"/>
      <text x="30" y="19" fill="#cbd5e1" font-size="11" font-weight="600">Network / HAR</text>
    </g>
  </g>

  <g class="pulse-pill-3" opacity="0.7">
    <g transform="translate(75, 290)">
      <rect width="135" height="28" rx="14" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
      <circle cx="15" cy="14" r="4" fill="#34d399"/>
      <text x="28" y="18" fill="#cbd5e1" font-size="11" font-weight="600">Console &amp; REPL</text>
    </g>
  </g>

  <g class="pulse-pill" opacity="0.7">
    <g transform="translate(995, 285)">
      <rect width="140" height="28" rx="14" fill="#1e293b" stroke="#f43f5e" stroke-width="1"/>
      <circle cx="15" cy="14" r="4" fill="#f43f5e"/>
      <text x="28" y="18" fill="#cbd5e1" font-size="11" font-weight="600">Time Travel State</text>
    </g>
  </g>

  <!-- Center Decorative Glow Halo behind Title -->
  <circle cx="600" cy="170" r="180" fill="#38bdf8" opacity="0.06" filter="url(#glow)"/>
  <circle cx="600" cy="170" r="110" fill="#818cf8" opacity="0.08" filter="url(#glow)"/>

  <!-- FOREGROUND CONTENT: Header Category Tag -->
  <g transform="translate(470, 56)">
    <rect width="260" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2"/>
    <text x="130" y="18" fill="#a5b4fc" font-size="11.5" font-weight="700" letter-spacing="1.5" text-anchor="middle">WEB DEV ECOSYSTEM</text>
  </g>

  <!-- FOREGROUND MAIN TITLE -->
  <text x="600" y="145" text-anchor="middle" font-size="38" font-weight="800" fill="url(#primaryGrad)" letter-spacing="-0.5">
    Awesome Web Developer Inspection &amp; DevTools
  </text>

  <!-- FOREGROUND SUBTITLE -->
  <text x="600" y="195" text-anchor="middle" font-size="16" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
    Curated Browser Debuggers, HTTP Interceptors, Mobile Web Consoles &amp; Framework Profilers
  </text>

  <!-- FEATURE TAG PILLS (Foreground Row) -->
  <g transform="translate(230, 230)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="135" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="67" y="21" fill="#38bdf8" font-size="12" font-weight="600" text-anchor="middle">🔍 DOM &amp; CSS</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(150, 0)">
      <rect width="140" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="70" y="21" fill="#818cf8" font-size="12" font-weight="600" text-anchor="middle">⚡ API &amp; Mocking</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(305, 0)">
      <rect width="145" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="72" y="21" fill="#c084fc" font-size="12" font-weight="600" text-anchor="middle">📱 Mobile Consoles</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(465, 0)">
      <rect width="135" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="67" y="21" fill="#34d399" font-size="12" font-weight="600" text-anchor="middle">⏱️ State Profiling</text>
    </g>
    <!-- Pill 5 -->
    <g transform="translate(615, 0)">
      <rect width="125" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="62" y="21" fill="#fbbf24" font-size="12" font-weight="600" text-anchor="middle">🌐 Cross-Browser</text>
    </g>
  </g>
</svg>
